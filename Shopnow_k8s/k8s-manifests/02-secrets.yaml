---
# =============================================================================
# ShopNow Secrets — database credentials + Keycloak admin
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: shopnow
type: Opaque
stringData:
  POSTGRES_DB: postgres
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: admin
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: shopnow
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: root
  MYSQL_DATABASE: keycloak
  MYSQL_USER: keycloak
  MYSQL_PASSWORD: password
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin-secret
  namespace: shopnow
type: Opaque
stringData:
  KEYCLOAK_ADMIN: admin
  KEYCLOAK_ADMIN_PASSWORD: admin

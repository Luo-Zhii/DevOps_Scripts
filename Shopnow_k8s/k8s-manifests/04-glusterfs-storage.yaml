---
# =============================================================================
# GlusterFS Storage Backend
# =============================================================================
# Endpoints + headless Service để K8s biết địa chỉ của GlusterFS cluster.
# PersistentVolumes bên dưới dùng glusterfs volume plugin với endpoint này.
#
# LƯU Ý: Thay <STORAGE-IP-1>, <STORAGE-IP-2>, <STORAGE-IP-3>
# bằng IP thực tế của storage-master-1,2,3 sau khi terraform apply.
# =============================================================================

---
# Headless Service — không có selector, manual endpoint
apiVersion: v1
kind: Service
metadata:
  name: glusterfs-cluster
  namespace: shopnow
spec:
  ports:
    - port: 1
      protocol: TCP
      targetPort: 1

---
# Endpoints trỏ đến 3 storage node
apiVersion: v1
kind: Endpoints
metadata:
  name: glusterfs-cluster
  namespace: shopnow
subsets:
  - addresses:
      - ip: STORAGE_MASTER_1_IP   # ← Thay bằng IP thực tế
      - ip: STORAGE_MASTER_2_IP   # ← Thay bằng IP thực tế
      - ip: STORAGE_MASTER_3_IP   # ← Thay bằng IP thực tế
    ports:
      - port: 1
        protocol: TCP

---
# PersistentVolume — PostgreSQL (10 Gi)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv
  labels:
    app: postgres
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  glusterfs:
    endpoints: glusterfs-cluster
    path: gv0
    readOnly: false
  mountOptions:
    - noatime

---
# PersistentVolume — MySQL (5 Gi)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-pv
  labels:
    app: mysql
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  glusterfs:
    endpoints: glusterfs-cluster
    path: gv0
    readOnly: false
  mountOptions:
    - noatime

---
# PersistentVolume — Keycloak realm import (1 Gi)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: keycloak-realm-pv
  labels:
    app: keycloak
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  glusterfs:
    endpoints: glusterfs-cluster
    path: gv0
    readOnly: false
  mountOptions:
    - noatime

---
# PersistentVolumeClaims
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: shopnow
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  selector:
    matchLabels:
      app: postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: shopnow
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  selector:
    matchLabels:
      app: mysql
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keycloak-realm-pvc
  namespace: shopnow
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  selector:
    matchLabels:
      app: keycloak

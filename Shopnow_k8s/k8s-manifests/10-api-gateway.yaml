---
# =============================================================================
# Spring Cloud Gateway (API Gateway) Deployment + Service
# =============================================================================
# ClusterIP Service:   port 5860 — internal K8s communication
# NodePort Service:     port 30001 → 5860 — cho Kong truy cập từ DMZ
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: shopnow
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: harbor-server/techcareer/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5860
              protocol: TCP
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://shopnow-discovery-server-service:8761/eureka/"
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: "http://keycloak.shopnow.svc.cluster.local:8080/realms/java-microservice-realm"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 5860
            initialDelaySeconds: 60
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 5860
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
# ClusterIP Service — dùng bởi các service khác trong K8s (qua Eureka)
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: shopnow
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  ports:
    - port: 5860
      targetPort: 5860
      protocol: TCP
      name: http
  selector:
    app: api-gateway

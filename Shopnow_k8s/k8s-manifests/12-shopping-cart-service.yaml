---
# =============================================================================
# Shopping Cart Service Deployment + Service
# =============================================================================
# API: /api/shopping-cart/** — quản lý giỏ hàng
# Gọi product-service qua Eureka để lấy giá sản phẩm
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-cart-service
  namespace: shopnow
  labels:
    app: shopping-cart-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopping-cart-service
  template:
    metadata:
      labels:
        app: shopping-cart-service
    spec:
      containers:
        - name: shopping-cart-service
          image: harbor-server/techcareer/shopping-cart-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5863
              protocol: TCP
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://shopnow-discovery-server-service:8761/eureka/"
            - name: SPRING_CONFIG_IMPORT
              value: "configserver:http://config-server.shopnow.svc.cluster.local:5859"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres.shopnow.svc.cluster.local:5432/postgres?useSSL=false"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: shopping-cart-service
  namespace: shopnow
  labels:
    app: shopping-cart-service
spec:
  type: ClusterIP
  ports:
    - port: 5863
      targetPort: 5863
      protocol: TCP
      name: http
  selector:
    app: shopping-cart-service

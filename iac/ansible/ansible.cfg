# =============================================================================
# Ansible Configuration
# =============================================================================
# Tuned for production: pipelining reduces SSH connections, host key checking
# is disabled for cloud ephemeral hosts, and the inventory points at the
# auto-generated YAML file from Terraform.
# =============================================================================

[defaults]
inventory      = ./inventory/hosts.yml
host_key_checking = False
pipelining     = True
forks          = 20
timeout        = 60
gathering      = smart
fact_caching   = jsonfile
fact_caching_connection = /tmp/ansible-cache
retry_files_enabled = False

# Role path — keep roles self-contained
roles_path     = ./roles

# Stdout callback for better readability
stdout_callback = yaml

[ssh_connection]
ssh_args       = -o ControlMaster=auto -o ControlPersist=60s
pipelining     = True

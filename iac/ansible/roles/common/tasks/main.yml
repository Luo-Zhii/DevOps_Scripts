---
# =============================================================================
# Common Role — tasks/main.yml
# =============================================================================
# Applied to ALL nodes before any service-specific configuration.
# Ensures a consistent baseline: updated packages, essential tools,
# time sync, and security hardening basics.
# =============================================================================

- name: Update apt cache (idempotent — only refreshes if stale)
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600
  tags: [always, bootstrap]

- name: Install essential system packages
  ansible.builtin.apt:
    name:
      - htop
      - iotop
      - net-tools
      - curl
      - wget
      - vim
      - git
      - unzip
      - python3
      - python3-pip
      - python3-venv
      - haveged        # Entropy daemon for crypto operations
      - ntp            # Time sync (critical for distributed systems)
      - jq             # JSON processor for API interactions
    state: present
  tags: [bootstrap]

- name: Ensure NTP is running and synced (critical for K8s, GlusterFS, GitLab)
  ansible.builtin.service:
    name: ntp
    state: started
    enabled: yes
  tags: [bootstrap, ntp]

- name: Set timezone to UTC (standard for distributed systems)
  ansible.builtin.timezone:
    name: Etc/UTC
  tags: [bootstrap]

- name: Set vm.swappiness to 1 (better for databases and caching services)
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "1"
    state: present
    reload: yes
  tags: [bootstrap, kernel]
  ignore_errors: yes # Not all images have ansible.posix; we continue gracefully

- name: Increase open file limits for high-traffic services
  ansible.builtin.lineinfile:
    path: /etc/security/limits.conf
    line: "{{ item }}"
    create: yes
  loop:
    - "* soft nofile 65536"
    - "* hard nofile 65536"
  tags: [bootstrap, limits]

- name: Enable automatic security updates (unattended-upgrades)
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
  tags: [bootstrap, security]

- name: Configure unattended-upgrades for security patches only
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
  tags: [bootstrap, security]

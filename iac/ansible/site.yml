---
# =============================================================================
# site.yml — Master Playbook cho DevOps Platform
# =============================================================================
# Chạy full:        ansible-playbook site.yml
# Chạy 1 nhóm:      ansible-playbook site.yml --limit load_balancers
# Chạy 1 server:    ansible-playbook site.yml --limit gitlab-server
#
# Cấu trúc thư mục role:  roles/<tên-server>/tasks/main.yml
#   Mỗi role tương ứng với 1 server/nhóm server cụ thể, không đặt tên chung chung.
# =============================================================================

# =========================================================================
# PHASE 0: Bootstrap — chạy trên TẤT CẢ 19 servers
# =========================================================================
- name: "[ALL] Bootstrap cơ bản cho tất cả server (packages, NTP, kernel tuning)"
  hosts: all
  become: yes
  roles:
    - common

# =========================================================================
# PHASE 1: Public DMZ — Internet-facing servers
# =========================================================================

# --- load-balancer-server: Nginx Reverse Proxy ---
- name: "[load-balancer-server] Cài đặt Nginx + UFW để reverse proxy cho internal services"
  hosts: load_balancers
  become: yes
  roles:
    - ufw
    - load-balancer-server

# --- teleport: Access Management ---
- name: "[teleport] Cài đặt UFW + chuẩn bị Teleport Access Management"
  hosts: teleport
  become: yes
  roles:
    - ufw

# --- kong-gateway: API Gateway ---
- name: "[kong-gateway] Cài đặt Kong API Gateway + Postgres + UFW"
  hosts: kong_gateway
  become: yes
  roles:
    - ufw
    - kong-gateway

# =========================================================================
# PHASE 2: Private Subnet — Platform Tools
# =========================================================================

# --- gitlab-server, harbor-server, sonarqube-server, rancher-server, dev-server ---
- name: "[Platform Tools] Cài đặt Docker prerequisites + UFW"
  hosts: platform_tools
  become: yes
  roles:
    - ufw
  tasks:
    - name: Cài đặt Docker engine prerequisites
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - gnupg
        state: present
        update_cache: yes
      tags: [docker, prereq]

# --- elk: Elasticsearch + Logstash + Kibana ---
- name: "[elk] Cài đặt ELK Stack (Elasticsearch + Logstash + Kibana)"
  hosts: elk
  become: yes
  roles:
    - ufw
    - elk

# --- rancher-server: K8s Cluster Management UI ---
- name: "[rancher-server] Cài đặt Rancher — Kubernetes Cluster Manager"
  hosts: rancher-server
  become: yes
  roles:
    - ufw
    - rancher-server

# =========================================================================
# PHASE 3: Kubernetes Cluster Bootstrap (v1.30) — 3 nodes (master + worker)
# =========================================================================
# 3 node vừa làm control-plane vừa chạy workload.
# Sau khi init cluster, bỏ taint để pod schedule được lên control-plane node.
# =========================================================================

- name: "[K8s] Bootstrap Kubernetes cluster 3 nodes (containerd + kubeadm + Calico)"
  hosts: k8s_masters
  become: yes
  roles:
    - ufw
  tasks:
    - name: Tắt swap (yêu cầu bắt buộc của kubeadm)
      ansible.builtin.command: swapoff -a
      changed_when: false
      tags: [k8s, swap]

    - name: Xóa swap khỏi /etc/fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^.*swap.*$'
        state: absent
      tags: [k8s, swap]

    - name: Load kernel modules cho K8s (overlay + br_netfilter)
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
      tags: [k8s, kernel]

    - name: Bật kernel modules ngay lập tức
      ansible.builtin.command: modprobe {{ item }}
      loop:
        - overlay
        - br_netfilter
      changed_when: false
      tags: [k8s, kernel]

    - name: Cấu hình sysctl cho K8s networking
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
      loop:
        - { key: "net.bridge.bridge-nf-call-iptables", value: "1" }
        - { key: "net.bridge.bridge-nf-call-ip6tables", value: "1" }
        - { key: "net.ipv4.ip_forward", value: "1" }
      ignore_errors: yes
      tags: [k8s, kernel]

    - name: Cài đặt glusterfs-client (cần cho GlusterFS PersistentVolume)
      ansible.builtin.apt:
        name: glusterfs-client
        state: present
      tags: [k8s, glusterfs]

    - name: Bỏ taint control-plane để schedule workload pods (dev mode)
      ansible.builtin.command:
        cmd: kubectl taint nodes --all node-role.kubernetes.io/control-plane- 2>/dev/null || true
      changed_when: false
      failed_when: false
      when: inventory_hostname == ansible_play_hosts[0]
      tags: [k8s, untaint]

  roles:
    - role: k8s-bootstrap

# =========================================================================
# PHASE 4: Storage HA Cluster
# =========================================================================

# --- storage-master-1, storage-master-2, storage-master-3 ---
- name: "[Storage Nodes] Deploy GlusterFS replicated volume"
  hosts: storage_nodes
  become: yes
  serial: 1  # Triển khai tuần tự từng node để đảm bảo ổn định cluster
  roles:
    - storage-nodes
